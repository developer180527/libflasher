# Builds, lints and tests libflasher on the three platforms it supports.
#
# `test` runs every unit test, including each backend's read-only tests
# against the runner's real disks (listing, refusing the system disk,
# keep-awake). `conformance` then writes for real: each job creates a
# throwaway virtual disk, names it in FLASHER_TEST_DISK, and runs the
# backend's full cycle (list, open, flash, verify, restore) against it. No
# real disk is ever written; the test also refuses anything over 512 MiB.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace

  conformance-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - run: cargo test -p libflasher_linux --features test-virtual-disks --no-run
      - run: cargo build -p libflasher_linux --features test-virtual-disks --bins
      - name: create a 256 MiB loop device
        run: |
          truncate -s 256M "$RUNNER_TEMP/disk.img"
          dev=$(sudo losetup --find --show --partscan "$RUNNER_TEMP/disk.img")
          echo "FLASHER_TEST_DISK=$dev" >> "$GITHUB_ENV"
      - name: conformance as an ordinary user, through libflasher-helper
        # The test runs unprivileged; opening and restoring the disk go
        # through the helper, with `sudo -n` standing in for pkexec's
        # password prompt. Before the root run, which leaves root-owned
        # build files behind.
        run: |
          test -n "$FLASHER_TEST_DISK"
          test "$(id -u)" != 0
          LIBFLASHER_HELPER=$PWD/target/debug/libflasher-helper LIBFLASHER_ELEVATOR=sudo \
            cargo test -p libflasher_linux --features test-virtual-disks conformance -- --ignored --nocapture --test-threads=1
      - name: conformance (as root, as writing a disk requires)
        run: |
          test -n "$FLASHER_TEST_DISK"
          sudo -E env "PATH=$PATH" cargo test -p libflasher_linux --features test-virtual-disks -- --ignored --nocapture --test-threads=1

  conformance-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p libflasher_macos --features test-virtual-disks --no-run
      - name: attach a 256 MiB disk image with a mounted exFAT volume
        # Like a stick out of the packet: on macOS 26 and later its exFAT
        # driver holds the disk, so it must be unmounted before it is opened.
        run: |
          hdiutil create -size 256m -fs ExFAT -volname FLASHTEST -layout GPTSPUD -type UDIF "$RUNNER_TEMP/disk"
          dev=$(hdiutil attach "$RUNNER_TEMP/disk.dmg" | head -1 | awk '{print $1}')
          mount | grep FLASHTEST
          echo "FLASHER_TEST_DISK=$dev" >> "$GITHUB_ENV"
      - name: conformance (as root, so no authopen prompt is needed)
        run: |
          test -n "$FLASHER_TEST_DISK"
          sudo -E env "PATH=$PATH" cargo test -p libflasher_macos --features test-virtual-disks -- --ignored --nocapture --test-threads=1

  conformance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p libflasher_windows --features test-virtual-disks --no-run
      - name: create and attach a 256 MiB VHD
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\disk.vhdx"
          "create vdisk file=`"$vhd`" maximum=256 type=expandable`r`nattach vdisk`r`n" |
            Out-File -Encoding ascii "$env:RUNNER_TEMP\mkdisk.txt"
          diskpart /s "$env:RUNNER_TEMP\mkdisk.txt"
          $n = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          "FLASHER_TEST_DISK=\\.\PhysicalDrive$n" >> $env:GITHUB_ENV
      - name: conformance (runners are elevated)
        shell: pwsh
        run: |
          if (-not $env:FLASHER_TEST_DISK) { exit 1 }
          cargo test -p libflasher_windows --features test-virtual-disks -- --ignored --nocapture --test-threads=1

  extract-boots:
    # Extract mode's real test: a UEFI ISO, extracted onto a disk image by
    # libflasher, must boot in QEMU on OVMF (open-source UEFI firmware).
    # The ISO holds only GRUB, told to print a marker and power off. Built
    # twice: by xorriso (ISO 9660 + Rock Ridge + Joliet, read through ISO
    # 9660) and by genisoimage with UDF (the Windows-style bridge, read
    # through UDF).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iso: [iso9660, udf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y grub-efi-amd64-bin grub-common xorriso genisoimage mtools ovmf qemu-system-x86
      - name: build a plain (non-hybrid) UEFI ISO
        run: |
          mkdir -p iso/EFI/BOOT
          printf 'echo FLASHER_BOOT_OK\nhalt\n' > grub.cfg
          grub-mkstandalone -O x86_64-efi -o iso/EFI/BOOT/BOOTX64.EFI "boot/grub/grub.cfg=grub.cfg"
          if [ "${{ matrix.iso }}" = udf ]; then
            genisoimage -quiet -udf -J -R -V FLASHERBOOT -o test.iso iso
          else
            xorriso -as mkisofs -R -J -V FLASHERBOOT -o test.iso iso
          fi
          truncate -s 128M disk.img
      - name: extract it with libflasher
        run: |
          FLASHER_TEST_ISO=$PWD/test.iso FLASHER_TEST_OUT=$PWD/disk.img \
            cargo test -p libflasher_core extract_to_file -- --ignored --nocapture
      - name: boot it
        run: |
          timeout 120 qemu-system-x86_64 -m 512 -nographic -no-reboot \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=disk.img,format=raw,if=virtio | tee serial.log || true
          grep -q FLASHER_BOOT_OK serial.log

  wim-split:
    # Splitting install.wim, judged by wimlib (an independent WIM
    # implementation, used here only as a test tool): it captures a real
    # LZX-compressed WIM, libflasher splits it, and wimlib must verify every
    # resource's SHA-1 and apply the split set back to identical files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y wimtools
      - name: capture a WIM of random files
        run: |
          mkdir -p data/sub
          for i in 1 2 3 4 5 6 7 8; do head -c 5M /dev/urandom > "data/file$i.bin"; done
          head -c 300K /dev/urandom > data/sub/small.bin
          echo "a text file" > "data/sub/Ünïcode name.txt"
          wimlib-imagex capture data test.wim "Test" --compress=LZX
          wimlib-imagex info test.wim
      - name: split it with libflasher (12 MB parts)
        run: |
          FLASHER_TEST_WIM=$PWD/test.wim FLASHER_TEST_SWM_DIR=$PWD/out FLASHER_TEST_SWM_PART=12000000 \
            cargo test -p libflasher_core split_wim_to_dir -- --ignored --nocapture
          ls -l out
          test -f out/install2.swm
      - name: wimlib verifies and applies the split set
        run: |
          wimlib-imagex info out/install.swm
          wimlib-imagex verify out/install.swm --ref="out/install*.swm"
          wimlib-imagex apply out/install.swm 1 applied --ref="out/install*.swm"
          diff -r data applied

  docs:
    name: docs and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
